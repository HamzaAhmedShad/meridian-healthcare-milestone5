name: Build, Deploy & Verified Rollback

on:
  push:
    branches: [main, test-rollback]

permissions:
  contents: read

# Both branches affect the same Deployment; never cancel a restoration in progress.
concurrency:
  group: meridian-healthcare-production
  cancel-in-progress: false

env:
  PROJECT_ID: meridian-healthcare-cost
  REGISTRY: us-central1-docker.pkg.dev
  REPO: my-docker-repo
  IMAGE: healthcare-api
  ZONE: us-central1-a
  DEPLOYMENT: healthcare-api
  CONTAINER: healthcare-api
  NAMESPACE: default
  BASE_URL: https://34-149-84-32.sslip.io

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Check syntax and release logic
        run: |
          python3 -c "import ast; from pathlib import Path; [ast.parse(p.read_text()) for p in Path('backend/app').rglob('*.py')]"
          python3 -m unittest discover -s tests/milestone6 -v
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Configure registry authentication
        run: gcloud auth configure-docker "$REGISTRY" --quiet
      - name: Build and publish immutable release
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="$REGISTRY/$PROJECT_ID/$REPO/$IMAGE:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --build-arg "APP_VERSION=$GITHUB_SHA" -t "$IMAGE_TAG" ./backend
          docker push "$IMAGE_TAG"
          IMAGE_DIGEST=$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")
          [[ "$IMAGE_DIGEST" == "$REGISTRY/$PROJECT_ID/$REPO/$IMAGE@sha256:"* ]]
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published image: $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy, Check Health & Recover
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up deployment tools
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: kubectl,gke-gcloud-auth-plugin
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: healthcare-gke
          location: ${{ env.ZONE }}
          project_id: ${{ env.PROJECT_ID }}
      - name: Deploy with explicit recovery and verification
        env:
          CANDIDATE_IMAGE: ${{ needs.build.outputs.image_digest }}
          RELEASE_COMMIT: ${{ github.sha }}
          ROLLBACK_DEMO: ${{ github.ref == 'refs/heads/test-rollback' && 'true' || 'false' }}
          # Bootstrap only: change to false after the first successful versioned release.
          ALLOW_LEGACY_BASELINE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ROLLBACK_DEMO" == "true" ]]; then
            export CANDIDATE_IMAGE="$REGISTRY/$PROJECT_ID/$REPO/$IMAGE:missing-demo-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          python3 scripts/deploy_release.py
