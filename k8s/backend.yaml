apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcare-api
  template:
    metadata:
      labels:
        app: healthcare-api
    spec:
      serviceAccountName: healthcare-api-sa
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      containers:
        - name: healthcare-api
          image: us-central1-docker.pkg.dev/meridian-healthcare-cost/my-docker-repo/healthcare-api@sha256:c15de3db39eb732d0076feb91414a9f7fa1425adecec87067a51b88fef748b1f
          env:
            - name: DEMO_ERROR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: healthcare-demo-error
                  key: token
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-api-service
spec:
  selector:
    app: healthcare-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
